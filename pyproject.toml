[project]
name = "hdrls"
version = "0.1.0"
description = "List the headers that an upstream C/C++ project includes directly"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hdrls = "hdrls.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hdrls"]
